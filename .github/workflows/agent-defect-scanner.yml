name: Agent - Defect scanner
run-name: ${{ inputs.seed != '' && format('Find similar to {0}', inputs.seed) || (github.event_name == 'schedule' && 'Weekly scan' || format('Scan {0}', inputs.scope || '(automatic selection)')) }}

# Design: docs/proposals/agents/defect-scanner.md
on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:
    inputs:
      scope:
        description: Comma-separated scope unit ids from .github/agent-prompts/defect-scanner/scopes.json (empty = automatic selection)
        required: false
        default: ""
      dry_run:
        description: Produce the report without filing issues, delivering security findings or advancing coverage
        type: boolean
        default: false
      custom_scopes:
        description: (find-similar) JSON array of generated scope units; replaces the catalogue selection
        required: false
        default: ""
      seed:
        description: (find-similar) The issue or PR the custom units were generated from, as issue:<n> or pr:<n>
        required: false
        default: ""

permissions: {}

# Scheduled and catalogue runs are serialised; find-similar runs are independent of them and of each other.
concurrency:
  group: ${{ inputs.custom_scopes != '' && format('find-similar-{0}', github.run_id) || 'defect-scanner' }}
  cancel-in-progress: false

env:
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      units: ${{ steps.plan.outputs.units }}
      seed: ${{ inputs.seed }}
      sha: ${{ steps.info.outputs.sha }}
      dry_run: ${{ steps.info.outputs.dry_run }}
      private: ${{ steps.info.outputs.private }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Fetch state branch
        run: git fetch --no-tags origin agent-state:refs/remotes/origin/agent-state || echo "No state branch yet"
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SCOPE_INPUT: ${{ inputs.scope }}
          UNITS_PER_RUN: ${{ vars.SCANNER_UNITS_PER_RUN }}
          UPSTREAM_ISSUE_REPOS: ${{ vars.UPSTREAM_ISSUE_REPOS }}
          CUSTOM_SCOPES: ${{ inputs.custom_scopes }}
          SEED: ${{ inputs.seed }}
        run: python3 .github/scripts/agent/scanner-plan.py
      - id: info
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "dry_run=$([[ "$DRY_RUN_INPUT" == true ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "private=$(gh api "repos/$REPO" --jq .private)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: scanner-context
          path: agent-context/
          retention-days: 14

  # One job per scope unit, in parallel. A failing unit does not stop the others.
  agent:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        unit: ${{ fromJSON(needs.plan.outputs.units) }}
    permissions:
      contents: read
      issues: read
    env:
      packageUser: ${{ secrets.PACKAGE_USER }}
      packagePAT: ${{ secrets.PACKAGE_PAT }}
      REPO: ${{ github.repository }}
      UNIT: ${{ matrix.unit }}
      GROUP_PREFIX: scanner_${{ github.run_number }}_
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 50
          persist-credentials: false

      - uses: ./.github/actions/setup-build

      - uses: actions/download-artifact@v8
        with:
          name: scanner-context
          path: scanner-context

      - name: Prepare prompt
        id: prep
        env:
          SHA: ${{ needs.plan.outputs.sha }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
          UPSTREAM_ISSUE_REPOS: ${{ vars.UPSTREAM_ISSUE_REPOS }}
          UPSTREAM_CODE_REPO: ${{ vars.UPSTREAM_CODE_REPO }}
        run: |
          set -euo pipefail
          mkdir -p agent-context agent-output agent-security
          cp scanner-context/known-issues.json agent-context/
          cp "scanner-context/$UNIT/scope.json" agent-context/scope.json
          cp agent-context/scope.json agent-output/scope.json
          jq -n --arg unit "$UNIT" --arg sha "$SHA" --arg run "$GITHUB_RUN_NUMBER" --arg dry "$DRY_RUN" \
            '{unit: $unit, sha: $sha, run_number: $run, dry_run: ($dry == "true")}' > agent-output/meta.json
          cp agent-output/meta.json agent-security/meta.json
          echo "schema=$(jq -c . .github/agent-prompts/defect-scanner/schema.json)" >> "$GITHUB_OUTPUT"
          delim="EOF_$(openssl rand -hex 8)"
          {
            echo "prompt<<$delim"
            cat .github/agent-prompts/defect-scanner/prompt.md
            echo
            echo "## Run context"
            echo
            echo "- Repository: $REPO"
            echo "- Scope unit: $UNIT (details in agent-context/scope.json)"
            if jq -e '.seed // empty' agent-context/scope.json > /dev/null; then
              echo "- Mode: find-similar (seed $(jq -r .seed agent-context/scope.json); follow the 'Find-similar mode' section)"
            fi
            echo "- Issue trackers to check for duplicates: $REPO ${UPSTREAM_ISSUE_REPOS:-}"
            echo "- Upstream code repository to check for open fix PRs: ${UPSTREAM_CODE_REPO:-none}"
            echo "- Checked-out commit (for permalinks): $SHA"
            echo "- Reproduction group prefix: $GROUP_PREFIX (use ${GROUP_PREFIX}1, ${GROUP_PREFIX}2, ...)"
            echo "- Workflow run: $RUN_URL"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          # find-similar dispatches this workflow with GITHUB_TOKEN, whose actor is github-actions[bot].
          allowed_bots: ${{ github.event_name == 'workflow_dispatch' && 'github-actions' || '' }}
          prompt: ${{ steps.prep.outputs.prompt }}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 150
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(.github/scripts/run-tests.sh:*),Bash(target/ballerina-runtime/bin/bal:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh api:*)"
            --disallowedTools "Bash(git push:*),Bash(git commit:*),Bash(gh issue create:*),Bash(gh issue comment:*),Bash(gh issue edit:*),WebFetch,WebSearch"
            --json-schema '${{ steps.prep.outputs.schema }}'

      # Security findings are split off here and never printed or uploaded with the public artifact.
      - name: Collect agent output
        if: always() && steps.claude.outcome != 'skipped'
        env:
          STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -uo pipefail
          printf '%s' "$STRUCTURED_OUTPUT" > agent-security/raw.json
          if jq -e 'type == "object"' agent-security/raw.json > /dev/null 2>&1; then
            jq 'del(.security)' agent-security/raw.json > agent-output/result.json
            jq '.security // []' agent-security/raw.json > agent-security/security.json
          else
            : > agent-output/result.json
            echo '[]' > agent-security/security.json
          fi
          rm agent-security/raw.json
          if [[ -n "$EXECUTION_FILE" && -f "$EXECUTION_FILE" ]]; then
            jq '[.[] | select(.type == "result")] | last | {num_turns, duration_ms, total_cost_usd, usage}' \
              "$EXECUTION_FILE" > agent-output/usage.json || true
          fi

      - name: Verify reproductions
        if: steps.claude.outcome == 'success'
        run: python3 .github/scripts/agent/verify-findings.py

      # Artifacts of public repositories are public: findings are encrypted to a public key whose private half only
      # publish-security holds (plaintext is allowed only in a private repository without a key).
      - name: Protect security findings
        if: steps.claude.outcome == 'success'
        env:
          SECURITY_TRANSFER_PUBLIC_KEY: ${{ vars.SECURITY_TRANSFER_PUBLIC_KEY }}
          REPO_PRIVATE: ${{ needs.plan.outputs.private }}
        run: .github/scripts/agent/security-transfer.sh encrypt agent-security

      - name: Mark unit completed
        run: touch agent-output/completed

      - uses: actions/upload-artifact@v7
        if: always() && steps.claude.outcome != 'skipped'
        with:
          name: scanner-output-${{ matrix.unit }}
          path: agent-output/
          retention-days: 14
          overwrite: true

      - uses: actions/upload-artifact@v7
        if: steps.claude.outcome == 'success'
        with:
          name: scanner-security-${{ matrix.unit }}
          path: agent-security/
          retention-days: 3
          overwrite: true

  publish-issues:
    needs: [plan, agent]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      DRY_RUN: ${{ needs.plan.outputs.dry_run }}
      MAX_ISSUES: ${{ vars.SCANNER_MAX_ISSUES }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: scanner-output-*
          path: outputs
      - run: python3 .github/scripts/agent/scanner-publish.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scanner-publish
          path: publish/
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true

  publish-security:
    needs: [plan, agent]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    outputs:
      found: ${{ steps.deliver.outputs.found }}
      delivered: ${{ steps.deliver.outputs.delivered }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      DRY_RUN: ${{ needs.plan.outputs.dry_run }}
      SECURITY_CHANNEL: ${{ vars.SECURITY_CHANNEL }}
      SECURITY_ADVISORY_TOKEN: ${{ secrets.SECURITY_ADVISORY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: scanner-security-*
          path: security
      - name: Decrypt security findings
        env:
          SECURITY_TRANSFER_PRIVATE_KEY: ${{ secrets.SECURITY_TRANSFER_PRIVATE_KEY }}
        run: |
          shopt -s nullglob
          # A single matching artifact is extracted into security/ itself.
          if [[ -f security/meta.json ]]; then dirs=(security/); else dirs=(security/*/); fi
          for dir in "${dirs[@]}"; do .github/scripts/agent/security-transfer.sh decrypt "$dir"; done
      - id: deliver
        run: python3 .github/scripts/agent/scanner-security.py

  update-state:
    needs: [plan, agent, publish-issues, publish-security]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Not sparse: the state worktree would inherit a sparse checkout and miss state.json.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: scanner-output-*
          path: outputs
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: scanner-publish
          path: publish
      - name: Update state and report
        env:
          UNITS: ${{ needs.plan.outputs.units }}
          SHA: ${{ needs.plan.outputs.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
          SEC_FOUND: ${{ needs.publish-security.outputs.found }}
          SEC_DELIVERED: ${{ needs.publish-security.outputs.delivered }}
          SEED: ${{ needs.plan.outputs.seed }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --no-tags --depth=1 origin agent-state:refs/remotes/origin/agent-state 2>/dev/null; then
            git worktree add -B agent-state state origin/agent-state
          else
            git worktree add --orphan -b agent-state state
          fi
          python3 .github/scripts/agent/scanner-state.py state
          git -C state add -A
          git -C state commit -q -m "Defect scanner run $RUN_NUMBER: $(jq -r 'join(", ")' <<< "$UNITS")"
          git -C state push -q origin agent-state

  # find-similar: one summary comment on the issue or PR the units were generated from.
  report-seed:
    needs: [plan, agent, publish-issues, update-state]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.seed != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SEED: ${{ needs.plan.outputs.seed }}
      DRY_RUN: ${{ needs.plan.outputs.dry_run }}
      RUN_NUMBER: ${{ github.run_number }}
      AGENT_RESULT: ${{ needs.agent.result }}
    steps:
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: scanner-publish
          path: publish
      - name: Comment on the seed
        run: |
          set -euo pipefail
          [[ "$SEED" =~ ^(issue|pr):([0-9]+)$ ]] || { echo "::error::Invalid seed $SEED"; exit 1; }
          number="${BASH_REMATCH[2]}"
          report=publish/publish-report.json
          [[ -f "$report" ]] || echo '{"filed": [], "would_file": [], "dropped": []}' > "$report"
          {
            echo "## Similar defects"
            echo
            if [[ "$AGENT_RESULT" != success ]]; then
              echo "> [!WARNING]"
              echo "> The search did not finish in every area, so the result below is partial. See the workflow run, then add \`agent/find-similar\` again to retry."
              echo
            fi
            if [[ "$(jq '.filed | length' "$report")" != 0 ]]; then
              echo "Filed, each verified with a reproduction test:"
              jq -r '.filed[] | "- \(.url) (\(.category))"' "$report"
            elif [[ "$(jq '.would_file | length' "$report")" != 0 ]]; then
              echo "Would file (dry run):"
              jq -r '.would_file[] | "- \(.title) (\(.category))"' "$report"
            else
              echo "No similar defects were confirmed."
            fi
            if [[ "$(jq '.dropped | length' "$report")" != 0 ]]; then
              echo
              echo "<details><summary>Dropped candidates</summary>"
              echo
              jq -r '.dropped[] | "- \(.title): \(.reason)"' "$report"
              echo
              echo "</details>"
            fi
            echo
            report_url=$(gh api "repos/$REPO/contents/defect-scanner/reports?ref=agent-state" \
              --jq ".[] | select(.name | endswith(\"-similar-${SEED/:/-}-run${RUN_NUMBER}.md\")) | .html_url" 2> /dev/null || true)
            if [[ -n "$report_url" ]]; then
              echo "[What was examined]($report_url)"
            fi
            echo
            echo "---"
            echo "<sub>Posted by the defect scanner (find similar) · [workflow run]($RUN_URL)</sub>"
          } > comment.md
          gh api "repos/$REPO/issues/$number/comments" -F body=@comment.md > /dev/null
