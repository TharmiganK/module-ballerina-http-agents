name: Agent - Bug fixer
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && (inputs.review_id != '' && format('Address review on PR #{0}', inputs.pr) || format('Auto-fix open threads on PR #{0}', inputs.pr))
  || github.event_name == 'pull_request_review' && format('Relay review on PR #{0}', github.event.pull_request.number)
  || github.event_name == 'issue_comment' && format('Address feedback on PR #{0}', github.event.issue.number)
  || github.event.label.name == 'agent/approved' && format('Fix #{0}: {1}', github.event.issue.number, github.event.issue.title)
  || format('Ignore label {0} on #{1}', github.event.label.name, github.event.issue.number) }}

# Implements a plan the issue analyser posted and a maintainer approved (agent/approved), opens the fix PR, and
# addresses review feedback on that PR (/agent, or automatically with agent/auto-fix).
# Design: docs/proposals/agents/issue-agents.md
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  # pull_request_review runs this file from the PR's test-merge commit, which can be far behind the default branch, so
  # the gate only relays an /agent review to a workflow_dispatch run (pr + review_id) that uses the current file.
  pull_request_review:
    types: [submitted]
  # Dispatched by the review relay above (pr + review_id) and by agent-auto-fix.yml (pr) once reviewers go quiet.
  workflow_dispatch:
    inputs:
      pr:
        description: Agent PR number
        required: true
      review_id:
        description: The /agent review to address; empty = every open thread (agent/auto-fix)
        required: false

permissions: {}

jobs:
  gate:
    # Cheap pre-filter so unrelated events do not start a runner. Only maintainers can start the agent.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'issues' && github.event.label.name == 'agent/approved')
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        && startsWith(github.event.comment.body, '/agent'))
      || (github.event_name == 'pull_request_review'
        && github.event.review.user.type != 'Bot'
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)
        && contains(github.event.pull_request.labels.*.name, 'agent/generated')
        && startsWith(github.event.review.body, '/agent'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: read
      actions: write
    outputs:
      phase: ${{ steps.route.outputs.phase }}
      number: ${{ steps.route.outputs.number }}
      issue: ${{ steps.route.outputs.issue }}
      ref: ${{ steps.route.outputs.ref }}
      review_id: ${{ steps.route.outputs.review_id }}
      comment_id: ${{ steps.route.outputs.comment_id }}
      mode: ${{ steps.route.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Route event to a phase
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DISPATCH_PR: ${{ inputs.pr }}
          DISPATCH_REVIEW: ${{ inputs.review_id }}
        run: |
          set -euo pipefail
          ev="$GITHUB_EVENT_PATH"
          first_word() { jq -r '. // "" | split("\n")[0] | split(" ")[0] | gsub("\\s"; "")'; }
          STATES=(agent/investigate agent/investigating agent/plan-ready agent/needs-info agent/analysed agent/split agent/approved agent/implementing agent/pr-open agent/failed)
          label() { gh api "repos/$REPO/issues/$number/labels" -f "labels[]=$1" > /dev/null; }
          unlabel() { for l in "$@"; do gh api -X DELETE "repos/$REPO/issues/$number/labels/$(jq -rn --arg s "$l" '$s|@uri')" > /dev/null 2>&1 || true; done; }
          # An open PR on an agent/issue-<n> branch; sets ref and issue.
          agent_pr() {
            local pr
            pr=$(gh pr view "$number" --repo "$REPO" --json headRefName,state,labels)
            ref=$(jq -r .headRefName <<< "$pr")
            [[ "$(jq -r .state <<< "$pr")" == OPEN && "$ref" =~ ^agent/issue-([0-9]+)$ ]] || return 1
            issue="${BASH_REMATCH[1]}"
            pr_labels=$(jq -c '[.labels[].name]' <<< "$pr")
          }

          phase="" ref="" review_id="" comment_id="" mode="" pr_labels="[]"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            number="$DISPATCH_PR"
          else
            number=$(jq -r '(.issue // .pull_request).number' "$ev")
          fi
          [[ "$number" =~ ^[0-9]+$ ]] || { echo "::error::Invalid number"; exit 1; }
          issue="$number"
          case "$GITHUB_EVENT_NAME" in
            issues)
              labels=$(jq -c '[.issue.labels[].name]' "$ev")
              has() { jq -e --arg l "$1" 'index($l)' <<< "$labels" > /dev/null; }
              if (has agent/plan-ready || has agent/failed) && ! has agent/pr-open && ! has agent/implementing; then
                phase=implement
                unlabel "${STATES[@]}"
                label agent/implementing
              else
                if has agent/analysed; then
                  gh api "repos/$REPO/issues/$number/comments" \
                    -f body="The bug fixer only implements bug plans. A maintainer can implement this proposal, or comment \`/agent\` to ask the issue analyser to treat it as a bug and plan a fix." > /dev/null
                fi
                echo "::notice::agent/approved needs agent/plan-ready (or agent/failed after an approved plan) and no open agent PR"
                unlabel agent/approved
              fi
              ;;
            issue_comment)
              comment_id=$(jq -r .comment.id "$ev")
              if [[ "$(jq '.comment.body' "$ev" | first_word)" != /agent ]]; then
                echo "::notice::Comment does not start with the /agent command"
              elif agent_pr; then
                phase=review
              else
                echo "::notice::#$number is not an open agent PR"
              fi
              ;;
            pull_request_review)
              if [[ "$(jq '.review.body' "$ev" | first_word)" != /agent ]]; then
                echo "::notice::Review does not start with the /agent command"
              elif agent_pr; then
                id=$(jq -r .review.id "$ev")
                gh workflow run agent-bug-fixer.yml --repo "$REPO" -f pr="$number" -f review_id="$id"
                echo "::notice::Relayed review $id on #$number to a workflow_dispatch run"
              fi
              ;;
            workflow_dispatch)
              if ! agent_pr; then
                echo "::notice::#$number is not an open agent PR"
              elif [[ -n "$DISPATCH_REVIEW" ]]; then
                [[ "$DISPATCH_REVIEW" =~ ^[0-9]+$ ]] || { echo "::error::Invalid review id"; exit 1; }
                review=$(gh api "repos/$REPO/pulls/$number/reviews/$DISPATCH_REVIEW")
                if [[ "$(jq '.body' <<< "$review" | first_word)" == /agent ]] \
                   && jq -e '.author_association | IN("OWNER", "MEMBER", "COLLABORATOR")' <<< "$review" > /dev/null; then
                  phase=review
                  review_id="$DISPATCH_REVIEW"
                else
                  echo "::notice::Review $DISPATCH_REVIEW is not a maintainer /agent review"
                fi
              elif jq -e 'index("agent/auto-fix")' <<< "$pr_labels" > /dev/null; then
                actionable=$(python3 .github/scripts/agent/pr-threads.py "$REPO" "$number" | jq '[.[] | select(.actionable)] | length')
                if (( actionable > 0 )); then
                  phase=review
                  mode=auto
                else
                  echo "::notice::No unaddressed review threads on #$number"
                fi
              else
                echo "::notice::#$number is not labelled agent/auto-fix"
              fi
              ;;
          esac
          {
            echo "phase=$phase"; echo "number=$number"; echo "issue=$issue"; echo "ref=$ref"
            echo "review_id=$review_id"; echo "comment_id=$comment_id"; echo "mode=$mode"
          } >> "$GITHUB_OUTPUT"
          echo "Phase: ${phase:-none} for #$number"

  run:
    needs: gate
    if: needs.gate.outputs.phase != ''
    uses: ./.github/workflows/agent-issue-run.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    secrets: inherit
    with:
      agent: bug-fixer
      phase: ${{ needs.gate.outputs.phase }}
      number: ${{ needs.gate.outputs.number }}
      issue: ${{ needs.gate.outputs.issue }}
      ref: ${{ needs.gate.outputs.ref }}
      review_id: ${{ needs.gate.outputs.review_id }}
      comment_id: ${{ needs.gate.outputs.comment_id }}
      mode: ${{ needs.gate.outputs.mode }}
      timeout: ${{ needs.gate.outputs.phase == 'implement' && 75 || 60 }}
      max_turns: ${{ needs.gate.outputs.phase == 'implement' && 100 || 80 }}
