name: Agent - Bug fixer

# Design: docs/proposals/agents/bug-fixer-agent.md
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  # Dispatched by agent-auto-fix.yml for PRs labelled agent/auto-fix once reviewers have gone quiet.
  workflow_dispatch:
    inputs:
      pr:
        description: Agent PR number whose open review threads should be addressed
        required: true

permissions: {}

jobs:
  gate:
    # Cheap pre-filter so unrelated events do not start a runner. The action re-checks write access.
    # The agent engages only on demand: labels for investigate/implement, a /bug-fixer command for discuss/review.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'issues'
        && (github.event.label.name == 'agent/investigate' || github.event.label.name == 'agent/approved'))
      || (github.event_name == 'issue_comment'
        && github.event.comment.user.type != 'Bot'
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        && startsWith(github.event.comment.body, '/bug-fixer'))
      || (github.event_name == 'pull_request_review'
        && github.event.review.user.type != 'Bot'
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)
        && contains(github.event.pull_request.labels.*.name, 'agent/generated')
        && startsWith(github.event.review.body, '/bug-fixer'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: read
    outputs:
      phase: ${{ steps.route.outputs.phase }}
      number: ${{ steps.route.outputs.number }}
      issue: ${{ steps.route.outputs.issue }}
      ref: ${{ steps.route.outputs.ref }}
      review_id: ${{ steps.route.outputs.review_id }}
      comment_id: ${{ steps.route.outputs.comment_id }}
      mode: ${{ steps.route.outputs.mode }}
      timeout: ${{ steps.route.outputs.timeout }}
      max_turns: ${{ steps.route.outputs.max_turns }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Route event to a phase
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DISPATCH_PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          ev="$GITHUB_EVENT_PATH"
          has() { jq -e --arg l "$1" '[(.issue // .pull_request).labels[].name] | index($l)' "$ev" > /dev/null; }
          command_given() { [[ "$(jq -r "$1 // \"\" | split(\"\\n\")[0] | split(\" \")[0] | gsub(\"\\\\s\"; \"\")" "$ev")" == /bug-fixer ]]; }
          # Issues carry a single agent/* state label; trigger labels are consumed when a run starts.
          STATES=(agent/investigate agent/investigating agent/plan-ready agent/needs-info agent/approved agent/implementing agent/pr-open agent/failed)
          label() { gh api "repos/$REPO/issues/$number/labels" -f "labels[]=$1" > /dev/null; }
          unlabel() { for l in "$@"; do gh api -X DELETE "repos/$REPO/issues/$number/labels/$(jq -rn --arg s "$l" '$s|@uri')" > /dev/null 2>&1 || true; done; }

          phase="" ref="" review_id="" comment_id="" mode=""
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            number="$DISPATCH_PR"
            [[ "$number" =~ ^[0-9]+$ ]] || { echo "::error::Invalid PR number"; exit 1; }
          else
            number=$(jq -r '(.issue // .pull_request).number' "$ev")
          fi
          issue="$number"
          case "$GITHUB_EVENT_NAME" in
            issues)
              if [[ "$(jq -r .label.name "$ev")" == agent/investigate ]]; then
                if ! has Type/Bug; then
                  echo "::notice::#$number is not labelled Type/Bug"
                elif has agent/investigating || has agent/implementing || has agent/pr-open; then
                  echo "::notice::#$number already has an agent run in progress or an open PR"
                  unlabel agent/investigate
                else
                  phase=investigate
                  unlabel "${STATES[@]}"
                  label agent/investigating
                fi
              else
                if (has agent/plan-ready || has agent/failed) && ! has agent/pr-open && ! has agent/implementing; then
                  phase=implement
                  unlabel "${STATES[@]}"
                  label agent/implementing
                else
                  echo "::notice::agent/approved needs agent/plan-ready (or agent/failed after an approved plan) and no open agent PR"
                  unlabel agent/approved
                fi
              fi
              ;;
            issue_comment)
              comment_id=$(jq -r .comment.id "$ev")
              if ! command_given .comment.body; then
                echo "::notice::Comment does not start with the /bug-fixer command"
              elif jq -e '.issue.pull_request' "$ev" > /dev/null; then
                pr=$(gh pr view "$number" --repo "$REPO" --json headRefName,state)
                ref=$(jq -r .headRefName <<< "$pr")
                if [[ "$(jq -r .state <<< "$pr")" == OPEN && "$ref" =~ ^agent/issue-([0-9]+)$ ]]; then
                  phase=review
                  issue="${BASH_REMATCH[1]}"
                fi
              elif has agent/plan-ready || has agent/needs-info || has agent/failed; then
                phase=discuss
              else
                echo "::notice::#$number is not waiting for discussion (no plan yet, a run in progress, or a PR is open)"
              fi
              ;;
            workflow_dispatch)
              pr=$(gh pr view "$number" --repo "$REPO" --json headRefName,state,labels)
              ref=$(jq -r .headRefName <<< "$pr")
              if [[ "$(jq -r .state <<< "$pr")" == OPEN && "$ref" =~ ^agent/issue-([0-9]+)$ ]] \
                 && jq -e '[.labels[].name] | index("agent/auto-fix")' <<< "$pr" > /dev/null; then
                issue="${BASH_REMATCH[1]}"
                actionable=$(python3 .github/scripts/agent/pr-threads.py "$REPO" "$number" | jq '[.[] | select(.actionable)] | length')
                if (( actionable > 0 )); then
                  phase=review
                  mode=auto
                else
                  echo "::notice::No unaddressed review threads on #$number"
                fi
              else
                echo "::notice::#$number is not an open agent PR labelled agent/auto-fix"
              fi
              ;;
            pull_request_review)
              ref=$(jq -r .pull_request.head.ref "$ev")
              if ! command_given .review.body; then
                echo "::notice::Review does not start with the /bug-fixer command"
              elif [[ "$(jq -r .pull_request.state "$ev")" == open && "$ref" =~ ^agent/issue-([0-9]+)$ ]]; then
                phase=review
                issue="${BASH_REMATCH[1]}"
                review_id=$(jq -r .review.id "$ev")
              fi
              ;;
          esac

          case "$phase" in
            investigate) timeout=55 max_turns=60 ;;
            discuss)     timeout=35 max_turns=30 ;;
            implement)   timeout=75 max_turns=100 ;;
            review)      timeout=60 max_turns=80 ;;
            *)           timeout=5 max_turns=1 ;;
          esac
          {
            echo "phase=$phase"; echo "number=$number"; echo "issue=$issue"; echo "ref=$ref"
            echo "review_id=$review_id"; echo "comment_id=$comment_id"; echo "mode=$mode"
            echo "timeout=$timeout"; echo "max_turns=$max_turns"
          } >> "$GITHUB_OUTPUT"
          echo "Phase: ${phase:-none} for #$number"

  agent:
    needs: gate
    if: needs.gate.outputs.phase != ''
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.gate.outputs.timeout) }}
    concurrency:
      group: bug-fixer-${{ needs.gate.outputs.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      packageUser: ${{ secrets.PACKAGE_USER }}
      packagePAT: ${{ secrets.PACKAGE_PAT }}
      PHASE: ${{ needs.gate.outputs.phase }}
      NUMBER: ${{ needs.gate.outputs.number }}
      ISSUE: ${{ needs.gate.outputs.issue }}
      REPO: ${{ github.repository }}
    steps:
      # Agent tooling (scripts, prompts, schemas) always comes from the default branch, never from the PR checkout,
      # which may be stale or PR-controlled.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: agent-tools
          sparse-checkout: |
            .github/scripts
            .github/agent-prompts
          persist-credentials: false
      - name: Move agent tooling out of the workspace
        run: |
          mv agent-tools "$RUNNER_TEMP/agent-tools"
          echo "TOOLS=$RUNNER_TEMP/agent-tools" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.ref }}
          fetch-depth: 50
          persist-credentials: false

      - uses: ./.github/actions/setup-build

      - name: Build agent context
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_ID: ${{ needs.gate.outputs.review_id }}
          COMMENT_ID: ${{ needs.gate.outputs.comment_id }}
          MODE: ${{ needs.gate.outputs.mode }}
        run: "$TOOLS/.github/scripts/agent/build-context.sh"

      - name: Prepare prompt and branch
        id: prep
        env:
          REVIEW_ID: ${{ needs.gate.outputs.review_id }}
          COMMENT_ID: ${{ needs.gate.outputs.comment_id }}
          MODE: ${{ needs.gate.outputs.mode }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          dir="$TOOLS/.github/agent-prompts/bug-fixer"
          base_sha=$(git rev-parse HEAD)
          if [[ "$PHASE" == implement ]]; then
            git checkout -q -b "agent/issue-$ISSUE"
          fi
          mkdir -p agent-output
          jq -n --arg phase "$PHASE" --arg number "$NUMBER" --arg sha "$base_sha" \
                --arg head_ref "$(git rev-parse --abbrev-ref HEAD)" --arg review_id "$REVIEW_ID" --arg mode "$MODE" \
                '{phase: $phase, number: $number, base_sha: $sha, head_ref: $head_ref, review_id: $review_id, mode: $mode}' \
                > agent-output/meta.json

          read_only='Read,Glob,Grep,Bash(.github/scripts/run-tests.sh:*),Bash(target/ballerina-runtime/bin/bal:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh api:*)'
          case "$PHASE" in
            investigate|discuss) tools="$read_only,Edit,Write" ;;
            implement|review)    tools="$read_only,Edit,Write,Bash(git add:*),Bash(git commit:*)" ;;
          esac
          echo "tools=$tools" >> "$GITHUB_OUTPUT"
          echo "schema=$(jq -c . "$dir/schemas/$PHASE.json")" >> "$GITHUB_OUTPUT"

          delim="EOF_$(openssl rand -hex 8)"
          {
            echo "prompt<<$delim"
            cat "$dir/common.md"
            echo
            cat "$dir/$PHASE.md"
            echo
            echo "## Run context"
            echo
            echo "- Repository: $REPO"
            echo "- Issue: #$ISSUE (use $ISSUE wherever the instructions say <issue>)"
            [[ "$PHASE" == review ]] && echo "- Pull request: #$NUMBER"
            [[ -n "$REVIEW_ID" ]] && echo "- Triggering review id: $REVIEW_ID"
            [[ -n "$COMMENT_ID" ]] && echo "- Triggering comment id: $COMMENT_ID"
            [[ "$MODE" == auto ]] && echo "- Mode: auto (agent/auto-fix; handle every actionable open thread)"
            echo "- Checked-out commit: $base_sha"
            echo "- Workflow run: $RUN_URL"
            echo "- Context files: $(ls agent-context | sed 's|^|agent-context/|' | tr '\n' ' ')"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          # Auto-fix dispatches come from GITHUB_TOKEN, whose actor is github-actions[bot].
          allowed_bots: ${{ github.event_name == 'workflow_dispatch' && 'github-actions' || '' }}
          prompt: ${{ steps.prep.outputs.prompt }}
          claude_args: |
            --model claude-opus-5-5
            --max-turns ${{ needs.gate.outputs.max_turns }}
            --allowedTools "${{ steps.prep.outputs.tools }}"
            --disallowedTools "Bash(git push:*),Bash(gh pr create:*),Bash(gh pr comment:*),Bash(gh pr edit:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh label:*),WebFetch,WebSearch"
            --json-schema '${{ steps.prep.outputs.schema }}'

      - name: Collect agent output
        if: always() && steps.claude.outcome != 'skipped'
        env:
          STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          printf '%s' "$STRUCTURED_OUTPUT" > agent-output/result.json
          base_sha=$(jq -r .base_sha agent-output/meta.json)
          if [[ "$PHASE" == implement || "$PHASE" == review ]]; then
            if [[ -n "$(git status --porcelain)" ]]; then
              echo "::warning::Agent left uncommitted changes; they are not included"
              git status --short
            fi
            git format-patch --stdout "$base_sha"..HEAD > agent-output/changes.patch
          fi
          if [[ -n "$EXECUTION_FILE" && -f "$EXECUTION_FILE" ]]; then
            jq '[.[] | select(.type == "result")] | last | {num_turns, duration_ms, total_cost_usd, usage, modelUsage}' \
              "$EXECUTION_FILE" > agent-output/usage.json || true
            cat agent-output/usage.json || true
          fi

      - name: Verify reproduction
        if: >-
          steps.claude.outcome == 'success'
          && (env.PHASE == 'investigate'
            || (env.PHASE == 'discuss' && fromJSON(steps.claude.outputs.structured_output || '{}').new_plan_version == 1))
        run: "$TOOLS/.github/scripts/agent/verify-repro.sh"

      - uses: actions/upload-artifact@v7
        if: always() && steps.claude.outcome != 'skipped'
        with:
          name: agent-output
          path: agent-output/
          retention-days: 14
          overwrite: true

  publish-issue:
    needs: [gate, agent]
    if: contains(fromJSON('["investigate","discuss"]'), needs.gate.outputs.phase)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      NUMBER: ${{ needs.gate.outputs.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: agent-output
          path: agent-output
      - run: .github/scripts/agent/publish.sh "${{ needs.gate.outputs.phase }}"

  publish-code:
    needs: [gate, agent]
    if: contains(fromJSON('["implement","review"]'), needs.gate.outputs.phase)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      NUMBER: ${{ needs.gate.outputs.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - uses: actions/download-artifact@v8
        with:
          name: agent-output
          path: agent-output
      - run: .github/scripts/agent/publish.sh "${{ needs.gate.outputs.phase }}"

  report-failure:
    needs: [gate, agent, publish-issue, publish-code]
    if: failure() && needs.gate.outputs.phase != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      NUMBER: ${{ needs.gate.outputs.number }}
      FAILED_PHASE: ${{ needs.gate.outputs.phase }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - run: .github/scripts/agent/publish.sh fail
